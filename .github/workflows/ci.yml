name: CI/CD - Billing Service

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  # Roda em todo PR e em todo push na main. É a checagem obrigatória da
  # proteção da branch main.
  build-test-quality:
    name: Build, testes e qualidade
    runs-on: ubuntu-latest
    env:
      # No nível do job para poder ser usado no "if" da etapa do SonarCloud
      # (o contexto "secrets" não é aceito em condições).
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
    - name: Baixar o código
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        fetch-depth: 0 # o SonarCloud precisa do histórico para atribuir as linhas

    - name: Configurar o Java (JDK 17)
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    # verify = compila, roda os testes unitários e falha se a cobertura de
    # linhas ficar abaixo de 80% (regra do JaCoCo no pom.xml).
    - name: Build, testes e cobertura mínima de 80%
      run: |
        chmod +x mvnw
        ./mvnw -B clean verify

    - name: Publicar relatório de cobertura
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: jacoco-report
        path: target/site/jacoco

    # Opcional: só roda se o secret SONAR_TOKEN estiver configurado (junto com
    # as variables SONAR_ORGANIZATION e SONAR_PROJECT_KEY). Sem o token, a
    # análise é feita localmente e o relatório vai como evidência no README.
    - name: Análise de qualidade (SonarCloud)
      if: env.SONAR_TOKEN != ''
      run: |
        ./mvnw -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
          -Dsonar.host.url=https://sonarcloud.io \
          -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }} \
          -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }} \
          -Dsonar.qualitygate.wait=true

  deploy:
    name: Imagem Docker e deploy no AKS
    needs: build-test-quality
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - name: Baixar o código
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Configurar o Java (JDK 17)
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build da aplicação (JAR)
      run: |
        chmod +x mvnw
        ./mvnw -B clean package -DskipTests

    - name: Login no Docker Hub
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build e push da imagem Docker
      uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
      with:
        context: .
        file: src/main/docker/Dockerfile.jvm
        push: true
        tags: |
          gilgledson/oficina-billing-service:latest
          gilgledson/oficina-billing-service:${{ github.sha }}

    - name: Autenticar no Azure
      uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Configurar contexto do AKS
      uses: azure/aks-set-context@4edaee69f820359371ee8bc85189ac03a21d3a58 # v3
      with:
        resource-group: oficina-resources
        cluster-name: oficina-aks-cluster

    # kubectl create secret --from-literal em vez de YAML com envsubst: não
    # quebra quando algum valor tem caractere especial de YAML.
    - name: Gerar o Secret a partir dos GitHub Secrets
      env:
        DB_PASSWORD: ${{ secrets.BILLING_DB_PASSWORD }}
        RABBITMQ_USERNAME: ${{ secrets.RABBITMQ_USERNAME }}
        RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
        AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
        NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
        MERCADOPAGO_ACCESS_TOKEN: ${{ secrets.MERCADOPAGO_ACCESS_TOKEN }}
        MERCADOPAGO_WEBHOOK_SECRET: ${{ secrets.MERCADOPAGO_WEBHOOK_SECRET }}
      run: |
        kubectl create secret generic oficina-billing-secrets \
          --from-literal=db-password="$DB_PASSWORD" \
          --from-literal=rabbitmq-username="$RABBITMQ_USERNAME" \
          --from-literal=rabbitmq-password="$RABBITMQ_PASSWORD" \
          --from-literal=azure-storage-connection-string="$AZURE_STORAGE_CONNECTION_STRING" \
          --from-literal=new-relic-license-key="$NEW_RELIC_LICENSE_KEY" \
          --from-literal=mercadopago-access-token="$MERCADOPAGO_ACCESS_TOKEN" \
          --from-literal=mercadopago-webhook-secret="$MERCADOPAGO_WEBHOOK_SECRET" \
          --dry-run=client -o yaml > k8s/secret.yaml

    - name: Deploy no Kubernetes (AKS)
      uses: Azure/k8s-deploy@c8cfec839dc09896b3b8cc40cd13d04792680771 # v5
      with:
        manifests: |
          k8s/configMap.yaml
          k8s/secret.yaml
          k8s/deployment.yaml
          k8s/service.yaml
          k8s/hpa.yaml
          k8s/ingress.yaml
        images: gilgledson/oficina-billing-service:${{ github.sha }}
