# Rota do API Gateway (Traefik) para o Billing: /api/orcamentos deixa de ir
# para o monólito e passa a ser atendida por este serviço. O prefixo mais
# específico tem prioridade sobre a rota "/" do OS Service.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oficina-billing-ingress
  namespace: default
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api/orcamentos
            pathType: Prefix
            backend:
              service:
                name: oficina-billing-service
                port:
                  number: 8080
